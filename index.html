<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/style.css">
    <script defer src="script/script.js"></script>
</head>
<body>
    <div class="container">
        <div class="options">
            <button id="rock" type="button">Rock</button>
            <button id="paper" type="button">Paper</button>
            <button id="scissor" type="button">Scissor</button>
        </div>
        <div>
            <div><span>Human score: </span><span class="human-score">0</span></div>
            <div><span>Computer score: </span><span class="computer-score">0</span></div>
            <div class="results"></div>
        </div>
    </div>
</body>
</html>
